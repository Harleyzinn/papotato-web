services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}
      NODE_ENV: development
    ports: ['127.0.0.1:3000:3000']
    volumes: ['roda-data:/app/data']
    depends_on: [livekit]
    # Image contains only production dependencies; force static serving while allowing local HTTP cookies.
    command: ['node', 'server/production.js']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command: ['--config', '/etc/livekit.yaml']
    ports:
      - '127.0.0.1:7880:7880'
      - '7881:7881'
      - '50000-50100:50000-50100/udp'
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}'
    volumes: ['./infra/livekit.dev.yaml:/etc/livekit.yaml:ro']
volumes:
  roda-data:
